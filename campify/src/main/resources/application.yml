server:
  port: ${SERVER_PORT:8083}
  max-http-request-header-size: 32KB


spring:
  application:
    name: ${SPRING_APP_NAME:campify}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campify}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:wissem123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    jdbc:
      dialect: postgresql
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:test@gmail.com}
    password: ${MAIL_PASS:test123}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          timeout: ${MAIL_TIMEOUT:5000}
          connectiontimeout: ${MAIL_CONN_TIMEOUT:5000}
      default-encoding: UTF-8
      messages:
        cache-duration: PT1S   # 1 s

